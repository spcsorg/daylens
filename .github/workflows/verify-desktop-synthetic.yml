name: Verify Synthetic Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/performance/**
      - .github/workflows/verify-desktop-synthetic.yml

permissions:
  contents: read

concurrency:
  group: synthetic-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npx electron-rebuild -f -w better-sqlite3,@paymoapp/active-window,keytar
      - run: npm run build:main
      - run: npm run build:preload
      - run: npm run build:renderer
      - run: node scripts/performance/desktop.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: synthetic-desktop-${{ matrix.os }}
          path: artifacts/desktop-synthetic/
          if-no-files-found: error
          retention-days: 7
