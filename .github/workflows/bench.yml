name: Bench

# Pull requests and main turn on once the test clock and app:package --test are on main (O-14): a release build ignores
# DAYLENS_TEST_NOW and the data folder, so it can't be benched on the world.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  bench:
    name: packaged bench on the heavy world (macos-15)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npm run app:package -- --test --dir
      # Late in a whole day, the same day on every run.
      - name: Seed the heavy world
        run: node app/tools/seed.ts --data-dir "$RUNNER_TEMP/heavy" --world heavy --now 2030-03-14T19:30:00-07:00
      - name: Bench the packaged test build
        run: node app/tools/bench.ts --data-dir "$RUNNER_TEMP/heavy" --now 2030-03-14T19:30:00-07:00 --app build/test/mac-arm64/Daylens.app --runs 100
